[package]
name = "soroban-secp256r1-contract"
version = "0.0.0"
edition = "2021"
publish = false
rust-version = "1.92.0"
description = "Soroban smart contract example demonstrating secp256r1 (NIST P-256) signature verification and custom account authentication."

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { version = "28.0.0" }

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

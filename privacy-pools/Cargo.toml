[workspace]
resolver = "2"
members = [
  "contract",
  "libs/lean-imt",
  "libs/zk",
  "cli/circom2soroban",
  "cli/coinutils",
  "circuits/test/lean-imt-test",
  "circuits/test/poseidon-test"
]

[workspace.dependencies]
soroban-sdk = { version = "28.0.0" }
# TODO: switch to a crates.io version once rs-soroban-poseidon publishes a
# release depending on soroban-sdk v28 (see stellar/rs-soroban-poseidon#18,
# merged but not yet released).
soroban-poseidon = { git = "https://github.com/stellar/rs-soroban-poseidon", rev = "0e680a1883ca177ca90c4d6b10a690101876baa6" }

[workspace.package]
rust-version = "1.92.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true

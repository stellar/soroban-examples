[package]
name = "bn254_verifier"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.91.0"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "27"

[dev-dependencies]
soroban-sdk = { version = "27", features = ["testutils"] }
ark-bn254 = "0.6"
ark-ff = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
